on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

name: R-CMD-check

# The repo root carries a renv scaffold (renv.lock, renv/, .Rprofile) for
# local reproducibility (see README). Its .Rprofile auto-activates renv on
# every Rscript invocation, which silently redirects package installs and
# pak's own library lookups into the renv-private project library -- neither
# job here uses renv::restore(); both rely on r-lib/actions' own
# pak-based resolution, which does not expect that redirection. Disabling
# the autoloader for CI is the fix (a documented renv option), not removing
# the scaffold, which is still useful for local `renv::restore()` runs.
env:
  RENV_CONFIG_AUTOLOADER_ENABLED: false

jobs:
  unit-tests:
    # Fast path: pure-R stability-metric and mapping-resolution-policy logic
    # (R/stability-metrics.R, R/mapping-matrix.R, R/fragility-lookup.R) needs
    # no Bioconductor packages, so this job runs on every push without
    # waiting on the heavy annotation/enrichment stack. Tests that do touch a
    # Suggests-only package (e.g. clusterProfiler) skip themselves via
    # `testthat::skip_if(requireNamespace(...))` rather than failing here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install testthat
        # Explicit repos=: renv's .Rprofile activation used to set a CRAN
        # mirror as a side effect (masking that nothing else here does),
        # which disabling the autoloader above removes along with the bug.
        # Use the RSPM *binary* mirror (same one use-public-rspm: true wires
        # up for setup-r-dependencies), not a source-only mirror: pointing
        # at plain cloud.r-project.org forced every dependency to compile
        # from source against this runner's R version, and fs's C++ build
        # failed partway through, taking pkgload and testthat down with it.
        run: install.packages("testthat", repos = "https://packagemanager.posit.co/cran/__linux__/noble/latest")
        shell: Rscript {0}
      - name: Run unit tests
        working-directory: idmapaudit
        run: |
          for (f in list.files("R", full.names = TRUE)) source(f)
          library(testthat)
          results <- test_dir("tests/testthat", reporter = "summary", stop_on_failure = FALSE)
          df <- as.data.frame(results)
          if (sum(df$failed) > 0 || any(df$error)) stop("Unit tests failed.")
        shell: Rscript {0}

  airway-smoke-test:
    # Plan §6: run the full DE -> ID-mapping-matrix -> enrichment ->
    # stability-metric pipeline on the airway prototype on every push, so
    # breakage is caught before it costs a debugging session scaling to the
    # three-dataset study.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: idmapaudit
          extra-packages: |
            any::testthat
            any::targets
            any::airway
            any::DESeq2
            any::SummarizedExperiment
            any::org.Hs.eg.db
            any::AnnotationDbi
            any::biomaRt
            any::clusterProfiler
            any::ReactomePA
            any::fgsea
          needs: check
      - name: Build and install idmapaudit
        run: R CMD INSTALL idmapaudit
      - name: Run unit tests (full Bioconductor stack installed)
        # The unit-tests job runs the same suite without clusterProfiler
        # installed, so its one Suggests-gated expectation self-skips
        # there; this step is what actually exercises it, and is the run
        # the paper's Table 1 footnote cites for the full 125-expectation
        # count. Kept as its own step (not merged into "Run airway
        # prototype pipeline") so a test failure and a pipeline failure
        # are never conflated in the log.
        working-directory: idmapaudit
        run: |
          for (f in list.files("R", full.names = TRUE)) source(f)
          library(testthat)
          results <- test_dir("tests/testthat", reporter = "summary", stop_on_failure = FALSE)
          df <- as.data.frame(results)
          if (sum(df$failed) > 0 || any(df$error)) stop("Unit tests failed.")
        shell: Rscript {0}
      - name: Run airway prototype pipeline
        working-directory: analysis/airway-prototype
        run: targets::tar_make()
        shell: Rscript {0}
      - uses: actions/upload-artifact@v4
        with:
          name: airway-fragility-table
          path: analysis/airway-prototype/results/airway_fragility_table.tsv
